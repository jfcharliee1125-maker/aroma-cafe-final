<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma & Café | Asistente Don Barista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #faf3e7; color: #3e2723; }

        .menu { background-color: #38251e; display: flex; justify-content: space-between; align-items: center; padding: 18px 8%; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #e8c99b; font-size: 27px; font-weight: bold; }
        .menu-links { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .menu a { text-decoration: none; color: #fff8ed; padding: 10px 16px; border-radius: 25px; transition: 0.3s; font-weight: 500; }
        .menu a:hover { background-color: #c08a54; color: white; }

        .contenedor-ia { max-width: 750px; margin: 50px auto; padding: 0 20px; }
        .tarjeta-ia { background: #ffffff; border-radius: 20px; padding: 35px; border: 2px solid #e7d4ba; box-shadow: 0 10px 30px rgba(56, 37, 30, 0.1); }

        .cabecera-choom { display: flex; align-items: center; gap: 18px; border-bottom: 2px solid #f0e1cc; padding-bottom: 20px; margin-bottom: 25px; }
        .avatar-grande { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #c08a54; object-fit: cover; background: #38251e; }
        .cabecera-choom h2 { color: #4b3024; font-size: 24px; }
        .badge-tiempo { display: inline-block; background: #eddac2; color: #593724; padding: 4px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; margin-top: 5px; }

        .paso-pregunta { display: none; animation: fadeIn 0.4s ease; }
        .paso-pregunta.activo { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .titulo-pregunta { font-size: 20px; color: #593724; margin-bottom: 20px; font-weight: 600; }
        .grid-opciones { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-opcion { background: #fffaf2; border: 2px solid #e7d4ba; padding: 16px 20px; border-radius: 14px; text-align: left; font-size: 16px; color: #3e2723; cursor: pointer; transition: 0.2s; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .btn-opcion:hover { background: #faebd7; border-color: #c08a54; transform: translateX(5px); }

        /* Resultado */
        #resultado-ia { display: none; text-align: center; animation: fadeIn 0.5s ease; }
        .porcentaje-match { background: #4CAF50; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 15px; display: inline-block; margin-bottom: 15px; }
        .img-recomendada { width: 240px; height: 180px; object-fit: cover; border-radius: 14px; margin: 15px auto; display: block; border: 2px solid #e7d4ba; }
        .nombre-prod { font-size: 26px; color: #4b3024; margin-bottom: 8px; }
        .desc-prod { color: #806653; font-size: 15px; max-width: 500px; margin: 0 auto 15px auto; line-height: 1.5; }
        .precio-prod { font-size: 22px; font-weight: bold; color: #a76b3f; margin-bottom: 20px; }

        .acciones-finales { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-accion { padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; }
        .btn-agregar-ia { background: #c08a54; color: white; }
        .btn-agregar-ia:hover { background: #98653b; }
        .btn-reintentar { background: #eddac2; color: #593724; }
    </style>
</head>
<body>
    <nav class="menu">
        <div class="logo">☕ Aroma & Café</div>
        <div class="menu-links">
            <a href="/">Inicio</a>
            <a href="/menu">Menú</a>
            <a href="/ordenar">🛒 Carrito</a>
        </div>
    </nav>

    <div class="contenedor-ia">
        <div class="tarjeta-ia">
            <div class="cabecera-choom">
                <img src="{{ url_for('static', filename='fino.jpg') }}" alt="Don Barista" class="avatar-grande">
                <div>
                    <h2>Asistente Don Barista</h2>
                    <span class="badge-tiempo" id="badge-momento">Detectando horario automático...</span>
                </div>
            </div>

            <!-- PREGUNTA 1 -->
            <div class="paso-pregunta activo" id="paso-1">
                <p class="titulo-pregunta" id="texto-p1">¿Qué nivel de antojo traes en este momento?</p>
                <div class="grid-opciones" id="opciones-p1"></div>
            </div>

            <!-- PREGUNTA 2 -->
            <div class="paso-pregunta" id="paso-2">
                <p class="titulo-pregunta">2. ¿Hacia qué perfil de sabor te inclinas hoy?</p>
                <div class="grid-opciones">
                    <button class="btn-opcion" onclick="responder(2, 'dulce')">🍫 Dulce, achocolatado o con frutas</button>
                    <button class="btn-opcion" onclick="responder(2, 'salado')">🧀 Salado, con queso, carnes o aguacate</button>
                    <button class="btn-opcion" onclick="responder(2, 'cafe_especias')">☕ Intenso, sabor a café puro o especias</button>
                    <button class="btn-opcion" onclick="responder(2, 'fresco')">🌿 Fresco, ligero o herbal</button>
                </div>
            </div>

            <!-- PREGUNTA 3 -->
            <div class="paso-pregunta" id="paso-3">
                <p class="titulo-pregunta">3. ¿Qué temperatura va mejor con tu mood?</p>
                <div class="grid-opciones">
                    <button class="btn-opcion" onclick="responder(3, 'caliente')">🔥 Caliente / Reconfortante</button>
                    <button class="btn-opcion" onclick="responder(3, 'frio')">❄️ Frío / Con hielo / Granizado</button>
                    <button class="btn-opcion" onclick="responder(3, 'cualquiera')">✨ Me da igual, sorpréndeme</button>
                </div>
            </div>

            <!-- RESULTADO FINAL -->
            <div id="resultado-ia">
                <span class="porcentaje-match" id="texto-porcentaje">94% de coincidencia</span>
                <p style="color: #593724; font-size: 16px; margin-bottom: 10px;" id="frase-choom"></p>
                <img id="img-res" src="" alt="Producto" class="img-recomendada">
                <h3 class="nombre-prod" id="nombre-res"></h3>
                <p class="desc-prod" id="desc-res"></p>
                <div class="precio-prod" id="precio-res"></div>

                <div class="acciones-finales">
                    <button class="btn-accion btn-agregar-ia" id="btn-add-carrito" onclick="agregarRecomendacionCarrito()">🛒 Agregar al carrito</button>
                    <button class="btn-accion btn-reintentar" onclick="reiniciarTest()">🔄 Probar otra combinación</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menuCompleto = [
            { nombre: "Pastel de chocolate", precio: 90, img: "/static/pa.jpg", desc: "Suave y esponjoso pastel elaborado con chocolate de alta calidad.", tipo: "platillo", sabor: "dulce", temp: "cualquiera", momentos: ["comida", "cena"] },
            { nombre: "Baguette", precio: 75, img: "/static/ba.jpg", desc: "Pan crujiente relleno de ingredientes frescos.", tipo: "platillo", sabor: "salado", temp: "cualquiera", momentos: ["desayuno", "comida", "cena"] },
            { nombre: "Croissant de Jamón y Queso", precio: 105, img: "/static/croissant.jpg", desc: "Pan hojaldrado con mantequilla, relleno de jamón de pavo y queso gouda derretido.", tipo: "platillo", sabor: "salado", temp: "caliente", momentos: ["desayuno", "cena"] },
            { nombre: "Panini de Pollo al Pesto", precio: 130, img: "/static/panini.jpg", desc: "Pechuga de pollo a la plancha, queso mozzarella, jitomate deshidratado y pesto.", tipo: "platillo", sabor: "salado", temp: "caliente", momentos: ["comida", "cena"] },
            { nombre: "Bagel de Salmón", precio: 145, img: "/static/bagel.jpg", desc: "Bagel de ajonjolí con queso crema a las finas hierbas, salmón ahumado y pepino.", tipo: "platillo", sabor: "fresco", temp: "frio", momentos: ["desayuno", "comida"] },
            { nombre: "Club Sandwich Clásico", precio: 155, img: "/static/club.jpg", desc: "Tres capas con pavo, tocino crujiente, queso americano, lechuga, jitomate y papas.", tipo: "platillo", sabor: "salado", temp: "caliente", momentos: ["comida"] },
            { nombre: "Toast de Aguacate", precio: 120, img: "/static/toast.jpg", desc: "Pan de masa madre, puré de aguacate, pepitas, chile en hojuelas y dos huevos pochados.", tipo: "platillo", sabor: "fresco", temp: "cualquiera", momentos: ["desayuno"] },
            { nombre: "Chilaquiles con Pollo", precio: 135, img: "/static/chilaquiles.jpg", desc: "Totopos bañados en salsa verde o roja, pollo deshebrado, crema y queso fresco.", tipo: "platillo", sabor: "salado", temp: "caliente", momentos: ["desayuno", "comida"] },
            { nombre: "Ensalada César con Pollo", precio: 140, img: "/static/ensalada.jpg", desc: "Lechuga romana, tiras de pollo a la parrilla, crotones de ajo y aderezo César.", tipo: "platillo", sabor: "fresco", temp: "frio", momentos: ["comida", "cena"] },
            { nombre: "Waffles con Frutos Rojos", precio: 110, img: "/static/waffle.jpg", desc: "Waffle dorado servido con fresas, zarzamoras y miel.", tipo: "platillo", sabor: "dulce", temp: "caliente", momentos: ["desayuno", "cena"] },
            
            { nombre: "Café Espresso", precio: 50, img: "/static/exp.jpg", desc: "Café intenso y aromático preparado con granos seleccionados.", tipo: "bebida", sabor: "cafe_especias", temp: "caliente", momentos: ["desayuno", "comida"] },
            { nombre: "Capuchino clásico", precio: 45, img: "/static/capu.jpg", desc: "Combinación de espresso, leche vaporizada y espuma cremosa.", tipo: "bebida", sabor: "cafe_especias", temp: "caliente", momentos: ["desayuno", "cena"] },
            { nombre: "Chocomilk", precio: 35, img: "/static/choco.jpg", desc: "Bebida dulce elaborada con leche y chocolate.", tipo: "bebida", sabor: "dulce", temp: "frio", momentos: ["desayuno", "cena"] },
            { nombre: "Latte de Vainilla o Caramelo", precio: 75, img: "/static/latte.jpg", desc: "Espresso con leche caliente vaporizada y jarabe suave de vainilla o caramelo.", tipo: "bebida", sabor: "dulce", temp: "caliente", momentos: ["desayuno", "comida", "cena"] },
            { nombre: "Chai Tea Latte", precio: 75, img: "/static/chai.jpg", desc: "Té negro concentrado con canela, cardamomo, jengibre y leche.", tipo: "bebida", sabor: "cafe_especias", temp: "caliente", momentos: ["comida", "cena"] },
            { nombre: "Iced Caramel Macchiato", precio: 80, img: "/static/iced.jpg", desc: "Leche fría con hielo, vainilla, shot de espresso y espiral de caramelo.", tipo: "bebida", sabor: "cafe_especias", temp: "frio", momentos: ["comida"] },
            { nombre: "Matcha Latte Helado", precio: 80, img: "/static/matcha.jpg", desc: "Té matcha ceremonial batido con leche, hielo y endulzante natural.", tipo: "bebida", sabor: "fresco", temp: "frio", momentos: ["desayuno", "comida"] },
            { nombre: "Frappuccino Moka", precio: 85, img: "/static/frappe.jpg", desc: "Bebida helada tipo granizado con espresso, leche, chocolate y crema batida.", tipo: "bebida", sabor: "dulce", temp: "frio", momentos: ["comida"] },
            { nombre: "Smoothie de Frutos Rojos", precio: 80, img: "/static/smoothie.jpg", desc: "Licuado denso de fresas, moras y arándanos congelados con yogur griego.", tipo: "bebida", sabor: "dulce", temp: "frio", momentos: ["desayuno", "comida"] },
            { nombre: "Tisana Frutal Fría", precio: 60, img: "/static/tisana.jpg", desc: "Infusión refrescante de frutos del bosque y jamaica con hielo.", tipo: "bebida", sabor: "fresco", temp: "frio", momentos: ["comida", "cena"] }
        ];

        let momentoActual = "desayuno";
        let respuestas = { tipo: "", sabor: "", temp: "" };
        let productoGanador = null;

        function detectarMomentoAutomatico() {
            const ahora = new Date();
            const dia = ahora.getDay(); // 0 = Domingo, 1 = Lunes ... 6 = Sábado
            const hora = ahora.getHours();

            let momentoDetectado = "desayuno";

            // Lunes a Viernes (1 al 5)
            if (dia >= 1 && dia <= 5) {
                if (hora >= 7 && hora < 12) {
                    momentoDetectado = "desayuno";
                } else if (hora >= 12 && hora < 17) {
                    momentoDetectado = "comida";
                } else {
                    momentoDetectado = "cena";
                }
            } 
            // Sábados y Domingos (6 o 0)
            else {
                if (hora >= 8 && hora < 12) {
                    momentoDetectado = "desayuno";
                } else if (hora >= 12 && hora < 17) {
                    momentoDetectado = "comida";
                } else {
                    momentoDetectado = "cena";
                }
            }

            fijarMomento(momentoDetectado);
        }

        function fijarMomento(momento) {
            momentoActual = momento;
            const badge = document.getElementById("badge-momento");
            const p1 = document.getElementById("texto-p1");
            const contOpciones = document.getElementById("opciones-p1");

            if (momento === "desayuno") {
                badge.innerText = "🌅 Desayuno (7:00 a.m. - 12:00 p.m.)";
                p1.innerText = "1. Buenos días, choom. ¿Cómo quieres arrancar hoy?";
                contOpciones.innerHTML = `
                    <button class="btn-opcion" onclick="responder(1, 'platillo')">🍳 Con un desayuno completo para agarrar energía</button>
                    <button class="btn-opcion" onclick="responder(1, 'bebida')">☕ Solo necesito mi dosis de cafeína o bebida matutina</button>
                `;
            } else if (momento === "comida") {
                badge.innerText = "☀️ Comida / Tarde (12:00 p.m. - 5:00 p.m.)";
                p1.innerText = "1. ¡Hora de recargar baterías! ¿Qué buscas esta tarde?";
                contOpciones.innerHTML = `
                    <button class="btn-opcion" onclick="responder(1, 'platillo')">🥪 Un platillo sustancioso o snack salado</button>
                    <button class="btn-opcion" onclick="responder(1, 'bebida')">🧋 Algo líquido y refrescante para seguir el día</button>
                `;
            } else {
                badge.innerText = "🌙 Cena / Antojo (5:00 p.m. en adelante)";
                p1.innerText = "1. Ya cayó la noche, choom. ¿Qué se te antoja para cerrar el día?";
                contOpciones.innerHTML = `
                    <button class="btn-opcion" onclick="responder(1, 'platillo')">🍰 Un postre o cena ligera antes de dormir</button>
                    <button class="btn-opcion" onclick="responder(1, 'bebida')">🍵 Una bebida reconfortante o ligera</button>
                `;
            }
        }

        function responder(paso, valor) {
            if (paso === 1) {
                respuestas.tipo = valor;
                document.getElementById("paso-1").classList.remove("activo");
                document.getElementById("paso-2").classList.add("activo");
            } else if (paso === 2) {
                respuestas.sabor = valor;
                document.getElementById("paso-2").classList.remove("activo");
                document.getElementById("paso-3").classList.add("activo");
            } else if (paso === 3) {
                respuestas.temp = valor;
                document.getElementById("paso-3").classList.remove("activo");
                calcularRecomendacion();
            }
        }

        function calcularRecomendacion() {
            let candidatos = menuCompleto.map(prod => {
                let puntos = 0;
                if (prod.tipo === respuestas.tipo) puntos += 40;
                if (prod.momentos.includes(momentoActual)) puntos += 25;
                if (prod.sabor === respuestas.sabor) puntos += 25;
                if (respuestas.temp === "cualquiera" || prod.temp === respuestas.temp || prod.temp === "cualquiera") puntos += 10;
                puntos += Math.floor(Math.random() * 12);
                return { ...prod, puntaje: puntos };
            });

            candidatos.sort((a, b) => b.puntaje - a.puntaje);
            productoGanador = candidatos[0];

            let porcentaje = Math.min(98, Math.max(86, productoGanador.puntaje));

            document.getElementById("texto-porcentaje").innerText = `✨ ${porcentaje}% de seguridad`;
            document.getElementById("frase-choom").innerHTML = `Analicé tus gustos para este horario y estoy <b>${porcentaje}% seguro</b> de que te va a encantar:`;
            document.getElementById("img-res").src = productoGanador.img;
            document.getElementById("nombre-res").innerText = productoGanador.nombre;
            document.getElementById("desc-res").innerText = productoGanador.desc;
            document.getElementById("precio-res").innerText = `$${productoGanador.precio} MXN`;

            document.getElementById("resultado-ia").style.display = "block";
        }

        function agregarRecomendacionCarrito() {
            if (!productoGanador) return;
            let carrito = JSON.parse(localStorage.getItem('carritoAroma')) || {};
            let totalActual = Object.values(carrito).reduce((acc, val) => acc + (parseInt(val) || 0), 0);

            if (totalActual + 1 > 20) {
                alert("⚠️ Ya alcanzaste el límite máximo de 20 artículos en tu carrito.");
                return;
            }

            carrito[productoGanador.nombre] = (carrito[productoGanador.nombre] || 0) + 1;
            localStorage.setItem('carritoAroma', JSON.stringify(carrito));

            const btn = document.getElementById("btn-add-carrito");
            btn.innerText = "✓ ¡Agregado al carrito!";
            btn.style.background = "#4CAF50";
            setTimeout(() => {
                window.location.href = "/ordenar";
            }, 900);
        }

        function reiniciarTest() {
            document.getElementById("resultado-ia").style.display = "none";
            document.getElementById("paso-1").classList.add("activo");
        }

        window.addEventListener("DOMContentLoaded", detectarMomentoAutomatico);
    </script>
</body>
</html>
